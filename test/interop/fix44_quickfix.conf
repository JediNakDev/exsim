# Exchange for test/interop/fix44_quickfix.py: two FIX 4.4 users, ports
# assigned by the OS and read from the ready line.

[exchange]
name = EXSIM
bind_address = 127.0.0.1
ouch_port = 0
fix_port = 0

[market_data]
address = 127.0.0.1
port = 16200                   # nothing listens; the feed is not checked here
retransmit_port = 0
session = EXSIM

[instrument AAPL]
tick_size = 0.01
lot_size = 1
min_price = 0.01
max_price = 1000.00
reference_price = 150.00
initial_phase = continuous

# ALICE keeps her orders across a reconnect, so a fill while she is away
# must come back through ResendRequest.
[user ALICE]
password = alice
protocol = fix44
session_id = 1
owner = 1
cancel_on_disconnect = false

[user BOB]
password = bob
protocol = fix44
session_id = 2
owner = 2
cancel_on_disconnect = true
