# Example exchange: ITCH 5.0 market data, OUCH 4.2 and FIX 4.4 order entry.
#
#   ./build/release/exsim_exchanged --config config/examples/exchange.conf
#
# Copy this file for your own exchange. A commented "key = value" line shows
# an optional key at its default. Relative paths are relative to this file.
# config/examples/cme.conf is the CME profile: MDP 3.0 market data and iLink 3.

[exchange]
name = EXSIM                   # FIX TargetCompID that clients must use
bind_address = 127.0.0.1       # every listener; 0.0.0.0 serves remote traders
ouch_port = 15000              # 0 = assigned by the OS and shown in the ready line
# fix_port = 0
admin_socket = exsim.sock      # runtime commands: echo status | nc -U config/examples/exsim.sock
max_connections = 16
# heartbeat_interval_ms = 1000
# trading_day_start = 00:00    # local time; commands outside the day are refused
# trading_day_end = 24:00

[market_data]
# protocol = itch50            # or mdp3, see config/examples/cme.conf
address = 239.192.10.1         # multicast group or unicast destination
port = 16000                   # feed destination, required
retransmit_port = 16001        # MoldUDP64 retransmission requests, over UDP
retransmit_buffer = 4096       # messages kept for retransmission
# interface =                  # multicast egress interface address; empty = default
# ttl = 1
# loopback = true
# max_payload = 1400           # bytes per packet
# noii_interval_ms = 1000

# Capacity, allocated at startup.
[engine]
max_instruments = 4
max_orders = 4096              # resting orders across all instruments
max_tokens_per_session = 4096  # client order IDs per user per day
store_messages_per_session = 8192
store_bytes_per_session = 1048576

# Optional record of every accepted command.
# [journal]
# path = exchange.journal
# on_failure = shutdown        # or continue
# flush_interval_ms = 1000     # 0 = flush only at shutdown

# The section name is the symbol. Prices are decimal dollars.
[instrument AAPL]
tick_size = 0.01
lot_size = 1
# max_order_qty = 1000000
min_price = 0.01
max_price = 1000.00
reference_price = 150.00       # auction tie-break until the first trade
initial_phase = continuous     # closed, pre_open, continuous, halted or pre_close

# The section name is the login username: at most 6 characters for OUCH.
[user ALICE]
password = alice
protocol = ouch42              # ouch42, fix44 or ilink3
session_id = 1                 # unique, nonzero
owner = 1                      # self-trade prevention group; 0 = none
# stp = none                   # none, cancel_resting, cancel_aggressor or cancel_both
cancel_on_disconnect = true

[user BOB]
password = bob
protocol = ouch42
session_id = 2
owner = 2
cancel_on_disconnect = true
